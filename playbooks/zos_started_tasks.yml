---
- name: Gather all z/OS STCs
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"
  
  tasks:
  - name: Display all started tasks.
    ibm.ibm_zos_core.zos_job_query:
      job_id: "STC*"
    register: zos_stc
  
  - name: Print return info from previous task
    ansible.builtin.debug:
      var: zos_stc
      